<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        padding: 12px;
        font-size: 13px;
        color: #222;
      }
      .logo {
        height: 40px;
        width: auto;
        display: block;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 11px;
        color: #888;
        margin: 0 0 8px;
      }
      #status {
        color: #555;
        margin-bottom: 10px;
      }
      #extensionId {
        font-size: 11px;
        color: #888;
        word-break: break-all;
        border-top: 1px solid #eee;
        padding-top: 8px;
      }
      .aioCheck {
        border-top: 1px solid #eee;
        margin-top: 10px;
        padding-top: 10px;
      }
      .aioCheck label {
        display: block;
        font-size: 11px;
        color: #666;
        margin-bottom: 2px;
      }
      .aioCheck input {
        width: 100%;
        box-sizing: border-box;
        font-size: 12px;
        padding: 5px 6px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .aioCheck button {
        width: 100%;
        font-size: 12px;
        padding: 6px;
        cursor: pointer;
      }
      #aioStatus {
        margin-top: 8px;
        font-size: 11px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="icons/icon-128.png" alt="StealMySERP" />
    <div class="subtitle">Crawler Bridge</div>
    <div id="status">
      Ready. The StealMySERP app talks to this extension directly — no need to click
      anything here unless things aren't working.
    </div>
    <div class="aioCheck">
      <label for="aioQuery">Keyword</label>
      <input id="aioQuery" type="text" placeholder="e.g. photosynthesis" />
      <label for="aioUrl">Your page URL</label>
      <input id="aioUrl" type="text" placeholder="https://example.com/your-page" />
      <button id="aioCheckBtn">Check AI Overview citation</button>
      <div id="aioStatus"></div>
    </div>
    <div id="extensionId"></div>
    <script src="popup.js"></script>
  </body>
</html>
